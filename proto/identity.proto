syntax = "proto3";
package p2panycast.identity.v1;
option go_package = "p2p-anycast/pkg/proto/identity;identity";

enum NodeRole {
  ROLE_UNSPECIFIED = 0;
  EDGE_ROUTER = 1;
  ORIGIN_NODE = 2;
}

enum AuthorizedPolicy {
  POLICY_CLUSTERED_RTT = 0;
  POLICY_TLS_SNI = 1;
  POLICY_FAILOVER_STANDBY = 2;
  POLICY_STRICT_SINGLETON = 3;
}

message PortRange {
  uint32 start = 1;
  uint32 end = 2;
}

message ServiceCapability {
  string service_pattern = 1;                 // Wildcard glob: "pbx-*", "mc-smp"
  repeated AuthorizedPolicy allowed_policies = 2;
  repeated PortRange allowed_ports = 3;
}

message IdentityClaims {
  uint64 serial_number = 1;
  string issuer_id = 2;
  string subject_id = 3;
  NodeRole role = 4;
  // field 5 reserved (was subject_mldsa_pubkey)
  string libp2p_peer_id = 6;                  // Base58-encoded libp2p Peer ID (derived from node's anchor key)
  int64 not_before = 7;                       // Unix timestamp (seconds)
  int64 not_after = 8;                        // Unix timestamp (seconds)
  repeated ServiceCapability capabilities = 9;
}

message SignedCapabilityManifest {
  bytes claims_payload = 1;                   // Deterministic Protobuf bytes of IdentityClaims
  bytes ca_signature = 2;                     // ML-DSA-87 signature from Root CA
  bytes ca_key_id = 3;                        // 32-byte SHA-256 hash of CA pubkey
}

// AuthHello is sent by the connecting node (Origin) to open mutual auth.
message AuthHello {
  SignedCapabilityManifest manifest = 1;
}

// AuthResponse is sent back by the receiving node (Edge) to complete mutual auth.
message AuthResponse {
  SignedCapabilityManifest manifest = 1;
}
