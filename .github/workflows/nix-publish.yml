name: Nix & NixOS Build, Check, and Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  check-and-build:
    name: Build & Verify (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v9

      - name: Check Nix Flake on native architecture
        run: nix flake check --system "${{ matrix.system }}" --print-build-logs

      - name: Build anycast-edge
        run: nix build .#packages.${{ matrix.system }}.anycast-edge --print-build-logs

      - name: Build anycast-origin
        run: nix build .#packages.${{ matrix.system }}.anycast-origin --print-build-logs

      - name: Build anycast-ca
        run: nix build .#packages.${{ matrix.system }}.anycast-ca --print-build-logs

      - name: Build edge-image (Docker)
        run: nix build .#packages.${{ matrix.system }}.edge-image --print-build-logs

      - name: Build origin-image (Docker)
        run: nix build .#packages.${{ matrix.system }}.origin-image --print-build-logs

      - name: Test NixOS Module Evaluation
        run: nix build .#checks.${{ matrix.system }}.nixosModuleTest --print-build-logs

  publish-docker:
    name: Build and Push Docker Images (${{ matrix.arch }})
    needs: check-and-build
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
            arch: arm64
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v9

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, smoke-test, and push native images
        env:
          NIX_SYSTEM: ${{ matrix.system }}
          ARCH: ${{ matrix.arch }}
        run: |
          OWNER_LOWER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          nix build ".#packages.${NIX_SYSTEM}.edge-image" -o result-edge-image
          nix build ".#packages.${NIX_SYSTEM}.origin-image" -o result-origin-image
          docker load < result-edge-image
          docker load < result-origin-image

          for IMAGE in anycast-edge anycast-origin; do
            ACTUAL_ARCH=$(docker image inspect "${IMAGE}:latest" --format '{{.Architecture}}')
            test "${ACTUAL_ARCH}" = "${ARCH}"
            docker run --rm "${IMAGE}:latest" --version
            REF="ghcr.io/${OWNER_LOWER}/${IMAGE}:${GITHUB_SHA}-${ARCH}"
            docker tag "${IMAGE}:latest" "${REF}"
            docker push "${REF}"
          done

  publish-manifests:
    name: Publish Multi-Architecture Image Tags
    needs: publish-docker
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish and verify shared image manifests
        run: |
          OWNER_LOWER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          for IMAGE in anycast-edge anycast-origin; do
            REF="ghcr.io/${OWNER_LOWER}/${IMAGE}"
            TAGS=(--tag "${REF}:latest" --tag "${REF}:${GITHUB_SHA}")
            if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              VERSION="${GITHUB_REF#refs/tags/}"
              TAGS+=(--tag "${REF}:${VERSION}" --tag "${REF}:${VERSION#v}")
            fi
            docker buildx imagetools create "${TAGS[@]}" \
              "${REF}:${GITHUB_SHA}-amd64" "${REF}:${GITHUB_SHA}-arm64"
            docker buildx imagetools inspect "${REF}:${GITHUB_SHA}" --raw \
              | jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]'
          done

  build-release-assets:
    name: Build Release Binaries (${{ matrix.arch }})
    needs: check-and-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
            arch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v9

      - name: Build native binaries and bundle archives
        env:
          NIX_SYSTEM: ${{ matrix.system }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p release-dist
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          for BINARY in anycast-edge anycast-origin anycast-ca; do
            nix build ".#packages.${NIX_SYSTEM}.${BINARY}" -o "result-${BINARY}"
            tar -czf "release-dist/${BINARY}-${TAG_NAME}-linux-${ARCH}.tar.gz" \
              -C "result-${BINARY}/bin" "${BINARY}"
          done

      - name: Upload architecture archives
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries-${{ matrix.arch }}
          path: release-dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish Release Assets
    needs: build-release-assets
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download both architecture archives
        uses: actions/download-artifact@v4
        with:
          pattern: release-binaries-*
          path: release-dist
          merge-multiple: true

      - name: Checksum all release archives
        working-directory: release-dist
        run: sha256sum *.tar.gz > SHA256SUMS

      - name: Upload binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-dist/*
          generate_release_notes: true

  publish-helm:
    name: Package and Push Helm Charts to GHCR
    needs: check-and-build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0' # or 'latest'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and Push Helm Charts
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          export HELM_EXPERIMENTAL_OCI=1

          # Login Helm to GHCR
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

          echo "Determining version..."
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            # Release tag
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "Packaging release version: ${VERSION}"
            helm package deploy/helm/anycast-edge --destination . --version "${VERSION}" --app-version "${VERSION}"
            helm package deploy/helm/anycast-origin --destination . --version "${VERSION}" --app-version "${VERSION}"
          else
            # Main branch (dev build)
            # Use the version from Chart.yaml but append the short SHA to avoid duplicate pushes
            # if we wanted, or just rely on standard Chart.yaml if not strict
            echo "Packaging dev version from Chart.yaml..."
            helm package deploy/helm/anycast-edge --destination .
            helm package deploy/helm/anycast-origin --destination .
          fi

          echo "Pushing Helm charts to GHCR..."
          for chart in *.tgz; do
            helm push "$chart" "oci://ghcr.io/${OWNER_LOWER}/charts"
          done
