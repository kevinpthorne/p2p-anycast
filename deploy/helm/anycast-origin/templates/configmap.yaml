{{- if not .Values.existingConfigMap }}
{{- $caPub := or (and .Values.publicValues .Values.publicValues.caPub) (and .Values.public .Values.public.caPub) (and .Values.secrets .Values.secrets.caPub) "" }}
{{- $manifest := or (and .Values.publicValues .Values.publicValues.manifestBase64) (and .Values.public .Values.public.manifestBase64) (and .Values.secrets .Values.secrets.manifestBase64) "" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "anycast-origin.fullname" . }}-config
  labels:
    {{- include "anycast-origin.labels" . | nindent 4 }}
data:
  origin_config.json: |
    {
      "edge_multiaddrs": {{ toJson .Values.config.edge_multiaddrs }},
      "services": {{ toJson .Values.config.services }}
    }
  {{- if $caPub }}
  ca.pub: {{ $caPub | quote }}
  {{- end }}
{{- if $manifest }}
binaryData:
  origin_manifest.pb: {{ $manifest | quote }}
{{- end }}
{{- end }}
