{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "anycast-origin.fullname" . }}-secrets
  labels:
    {{- include "anycast-origin.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if and .Values.secrets .Values.secrets.caPub }}
  ca.pub: {{ .Values.secrets.caPub | b64enc | quote }}
  {{- end }}
  {{- if and .Values.secrets .Values.secrets.manifestBase64 }}
  origin_manifest.pb: {{ .Values.secrets.manifestBase64 | quote }}
  {{- end }}
  identity.key: {{ .Values.secrets.identityKey | b64enc | quote }}
  master.key: {{ .Values.secrets.masterKey | b64enc | quote }}
{{- end }}
