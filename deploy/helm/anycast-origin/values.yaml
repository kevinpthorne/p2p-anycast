replicaCount: 1

image:
  repository: anycast-origin
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

# Origin typically doesn't need public exposure through LoadBalancer
# unless there's a local diagnostic port or similar.
service:
  type: ClusterIP
  ports: []

config:
  # The config JSON will be created as a ConfigMap
  edge_multiaddrs: []
    # - "/ip4/203.0.113.10/udp/4002/quic-v1/p2p/12D3KooWEdgePeerID..."
  services: []
    # - service_id: "web-api"
    #   protocol: "TCP"
    #   public_port: 443
    #   policy: "CLUSTERED_RTT"
    #   sni_hostname: "api.example.com"
    #   target: "127.0.0.1:8080"
    #   enable_proxy_protocol: true
    # - service_id: "pbx-sip"
    #   protocol: "UDP"
    #   public_port: 5060
    #   policy: "STRICT_SINGLETON"
    #   target: "127.0.0.1:5060"

# Secret containing the CA public key, origin manifest, identity key, and master key
existingSecret: ""
# If existingSecret is not provided, the chart will look for these values to create a secret
secrets:
  caPub: ""        # string: PEM encoded CA public key
  manifestBase64: "" # string: Base64 encoded manifest.pb or raw text manifest
  identityKey: ""  # string: Hardware/filesystem identity key content
  masterKey: ""    # string: 256-bit master key in hex

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

identity:
  pvc:
    enabled: false
    # storageClassName: ""
    accessModes:
      - ReadWriteOnce
    size: 100Ki
    existingClaim: ""
